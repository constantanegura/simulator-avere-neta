services:
  - type: web
    name: simulator-avere-neta
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/info
    envVars:
      # Cheia pentru ecranul de prezentare (butonul „Sesiune nouă”). Render o cere la publicare.
      - key: ADMIN_KEY
        sync: false
      - key: TUNNEL
        value: "0"
